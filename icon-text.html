<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
body { margin: 0; font-family: sans-serif; }
.bg { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); padding: 40px 20px; }
.row { display: flex; gap: 28px; justify-content: center; align-items: center; }
.btn { text-align: center; color: white; }
.circle { width: 54px; height: 54px; border-radius: 50%; background: white; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
.circle span { font-size: 24px; color: #1a1a1a; }
.label { font-size: 14px; }
h2 { color: white; text-align: center; }
</style></head><body>
<div class="bg">
<h2>文字图标版</h2>
<div class="row">
<div class="btn"><div class="circle"><span>✓</span></div><div class="label">已看</div></div>
<div class="btn"><div class="circle"><span>♥</span></div><div class="label">收藏</div></div>
<div class="btn"><div class="circle"><span>🎬</span></div><div class="label">版本</div></div>
<div class="btn"><div class="circle"><span>🎧</span></div><div class="label">音频</div></div>
<div class="btn"><div class="circle"><span style="font-size:16px;font-weight:bold;">CC</span></div><div class="label">字幕</div></div>
</div>
</div>
</body></html>
